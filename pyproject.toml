[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.backends.legacy:build"

[project]
name = "fanything"
version = "0.1.0"
description = "FAN/1 fingerprinting: passive and active extraction for TLS, DTLS, SSH, QUIC, IKEv2, RDP, and TCP/IP stacks"
requires-python = ">=3.9"
dependencies = [
    "pycapng",
]

[project.optional-dependencies]
quic = [
    "cryptography",
]
dev = [
    "cryptography",
]

[project.scripts]
fanfp = "fanfp:main"
